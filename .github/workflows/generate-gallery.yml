name: Auto Generate Gallery JSON

on:
  push:
    paths:
      - 'manhajul/**'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Gallery JSON
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const dir = "manhajul";
          if (fs.existsSync(dir)) {
            const files = fs.readdirSync(dir).filter(file => /\.(jpg|jpeg|png|webp)$/i.test(file));
            const galleryData = { "manhajul": files };
            fs.writeFileSync("manhajul/gallery.json", JSON.stringify(galleryData, null, 2));
            console.log("gallery.json generated successfully with " + files.length + " images.");
          }
          '

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generate gallery.json"
          file_pattern: "manhajul/gallery.json"
          
