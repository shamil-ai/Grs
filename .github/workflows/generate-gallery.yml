name: Auto Generate Gallery JSON

on:
  push:
    paths:
      - 'manhajul/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate JSON File
        run: |
          python3 -c "
          import os, json
          base_dir = 'manhajul'
          gallery = {}
          if os.path.exists(base_dir):
              for root, dirs, files in os.walk(base_dir):
                  rel_path = os.path.relpath(root, base_dir)
                  if rel_path == '.': continue
                  images = [f'{rel_path}/{f}' for f in files if f.lower().endswith(('.jpg', '.jpeg', '.png', '.webp', '.gif'))]
                  if images:
                      gallery[rel_path] = sorted(images)
          with open(os.path.join(base_dir, 'gallery.json'), 'w') as f:
              json.dump(gallery, f, indent=2)
          "

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add manhajul/gallery.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-updated gallery.json" && git push)
          
