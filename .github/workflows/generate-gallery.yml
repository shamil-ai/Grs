Name: Auto Generate Gallery JSON

on:
  push:
    paths:
      - 'manhajul/**/*.jpg'
      - 'manhajul/**/*.jpeg'
      - 'manhajul/**/*.png'
      - 'manhajul/**/*.webp'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Gallery JSON
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          const targetDir = "manhajul"; // നിങ്ങളുടെ ഫോട്ടോകൾ ഉള്ള ഫോൾഡർ പേര്
          if (fs.existsSync(targetDir)) {
            const subDirs = fs.readdirSync(targetDir, { withFileTypes: true })
              .filter(dirent => dirent.isDirectory())
              .map(dirent => dirent.name);

            subDirs.forEach(subDir => {
              const fullDirPath = path.join(targetDir, subDir);
              const files = fs.readdirSync(fullDirPath).filter(file => /\.(jpg|jpeg|png|webp)$/i.test(file));
              
              if (files.length > 0) {
                // ഫോൾഡർ പേര് സഹിതം ഫയലുകൾ സേവ് ചെയ്യുന്നു
                const filePaths = files.map(file => `${subDir}/${file}`);
                const galleryData = { [subDir]: filePaths };
                
                fs.writeFileSync(path.join(fullDirPath, "gallery.json"), JSON.stringify(galleryData, null, 2));
                console.log(`gallery.json generated for ${subDir} with ${files.length} images.`);
              }
            });
          }
          '

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generate gallery.json for subfolders"
          file_pattern: "manhajul/**/gallery.json"
