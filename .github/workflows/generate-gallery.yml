name: Auto Generate Gallery JSON

on:
  push:
    paths:
      - "alif-*/**/*.jpg"
      - "alif-*/**/*.jpeg"
      - "alif-*/**/*.png"
      - "alif-*/**/*.webp"
      - ".github/workflows/generate-gallery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Gallery JSON
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const outputFile = 'gallery.json';
            let galleryData = {};

            // സ്കാൻ ചെയ്യേണ്ടത് മെയിൻ ഡയറക്ടറിയിൽ തന്നെയാണ്
            const items = fs.readdirSync('.', { withFileTypes: true });
            
            items.forEach(item => {
              if (item.isDirectory() && item.name.startsWith('alif-')) {
                const folderName = item.name;
                galleryData[folderName] = [];
                
                const files = fs.readdirSync(folderName);
                files.forEach(file => {
                  if (/\.(jpg|jpeg|png|webp)$/i.test(file)) {
                    galleryData[folderName].push(file);
                  }
                });
              }
            });

            fs.writeFileSync(outputFile, JSON.stringify(galleryData, null, 2));
            console.log('Gallery JSON generated successfully in root directory!');

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generate gallery JSON directly in root"
          file_pattern: "gallery.json"
